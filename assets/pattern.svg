<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="400"
     height="400"
     viewBox="0 0 400 400">

    <defs>

        <!-- Background -->
        <pattern id="kvPattern"
                 width="80"
                 height="80"
                 patternUnits="userSpaceOnUse">

            <!-- Connecting Lines -->
            <path d="M40 0 V80
                     M0 40 H80"
                  stroke="#D9E7F2"
                  stroke-width="1.2"/>

            <!-- Diagonal Connections -->
            <path d="M40 40 L80 0
                     M40 40 L80 80
                     M40 40 L0 0
                     M40 40 L0 80"
                  stroke="#EAF3FA"
                  stroke-width="0.8"/>

            <!-- Circuit Nodes -->
            <circle cx="40" cy="40" r="4" fill="#0F4C81"/>
            <circle cx="40" cy="0" r="2.5" fill="#67B246"/>
            <circle cx="40" cy="80" r="2.5" fill="#67B246"/>
            <circle cx="0" cy="40" r="2.5" fill="#67B246"/>
            <circle cx="80" cy="40" r="2.5" fill="#67B246"/>

        </pattern>

    </defs>

    <rect width="100%"
          height="100%"
          fill="url(#kvPattern)"/>

</svg>